name: Generate and merge tokens

on:
  push:
    branches: [tokens]
    paths: [tokens.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tokens-to-main
  cancel-in-progress: false

jobs:
  generate-and-merge:
    if: github.ref == 'refs/heads/tokens'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare merge candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main tokens
          if [ "$(git rev-parse origin/tokens)" != "$GITHUB_SHA" ]; then
            echo 'The tokens branch has advanced; skipping this outdated run.'
            exit 1
          fi
          git switch -c tokens-candidate
          git merge --no-edit origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run tokens:build
      - run: npm run build

      - name: Commit generated files and merge into main
        shell: bash
        run: |
          set -euo pipefail
          git add src/generated/_tokens.scss src/generated/tokens.js
          if ! git diff --cached --quiet; then
            git commit -m 'chore: generate SCSS and JavaScript tokens'
          fi
          # Publish the exact validated commit to both branches together.
          # Reject any concurrent branch update rather than overwrite it.
          git push --atomic origin HEAD:refs/heads/tokens HEAD:refs/heads/main
